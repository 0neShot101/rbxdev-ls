name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Build server
        run: bun run build

      - name: Build MCP
        run: bun run build:mcp

      - name: Run server tests
        run: bun test --cwd packages/server

      - name: Run MCP tests
        run: bun test --cwd packages/mcp

      - name: Bundle VS Code extension
        run: bun run --cwd packages/vscode bundle

      - name: Install website dependencies
        run: bun install --frozen-lockfile
        working-directory: apps/web

      - name: Check website
        run: bun run --cwd apps/web check

      - name: Build website
        run: bun run --cwd apps/web build

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version change
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Current version: ${version}"

          old_version="none"
          if git show HEAD~1:package.json >/dev/null 2>&1; then
            old_version="$(node -e "console.log(JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version)" < <(git show HEAD~1:package.json))" || old_version="none"
          fi
          echo "Previous version: ${old_version}"

          if [[ "${version}" != "${old_version}" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changed, will release."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged, skipping release."
          fi

      - name: Setup Bun
        if: steps.version.outputs.changed == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Setup Foreman (Rojo)
        if: steps.version.outputs.changed == 'true'
        uses: Roblox/setup-foreman@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          allow-external-github-orgs: true

      - name: Install dependencies
        if: steps.version.outputs.changed == 'true'
        run: bun install --frozen-lockfile

      - name: Build server
        if: steps.version.outputs.changed == 'true'
        run: bun run build

      - name: Build MCP
        if: steps.version.outputs.changed == 'true'
        run: bun run build:mcp

      - name: Bundle and package VS Code extension
        if: steps.version.outputs.changed == 'true'
        run: |
          cd packages/vscode
          bun run bundle
          bun run copy-server
          bun run package

      - name: Build Studio plugin
        if: steps.version.outputs.changed == 'true'
        run: bun run build:studio

      - name: Validate assets
        if: steps.version.outputs.changed == 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          test -f "packages/vscode/rbxdev-ls-${version}.vsix" || { echo "VSIX not found"; exit 1; }
          test -f "roblox/studio-plugin/dist/rbxdev-studio-bridge.rbxm" || { echo "Studio plugin not found"; exit 1; }

      - name: Publish to VS Code Marketplace
        if: steps.version.outputs.changed == 'true'
        run: bunx @vscode/vsce publish --packagePath rbxdev-ls-${{ steps.version.outputs.version }}.vsix --pat ${{ secrets.VSCE_PAT }}
        working-directory: packages/vscode

      - name: Publish to Open VSX
        if: steps.version.outputs.changed == 'true'
        run: bunx ovsx publish rbxdev-ls-${{ steps.version.outputs.version }}.vsix --pat ${{ secrets.OVSX_PAT }}
        working-directory: packages/vscode
        continue-on-error: true

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            packages/vscode/rbxdev-ls-${{ steps.version.outputs.version }}.vsix
            roblox/studio-plugin/dist/rbxdev-studio-bridge.rbxm

  publish-mcp:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version change
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          should_publish="false"
          old_version="none"
          if git show HEAD~1:package.json >/dev/null 2>&1; then
            old_version="$(node -e "console.log(JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version)" < <(git show HEAD~1:package.json))" || old_version="none"
          fi

          if [[ "${version}" != "${old_version}" ]]; then
            should_publish="true"
          fi

          echo "should_publish=${should_publish}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.version.outputs.should_publish == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup Bun
        if: steps.version.outputs.should_publish == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: steps.version.outputs.should_publish == 'true'
        run: bun install --frozen-lockfile

      - name: Build server (for exports)
        if: steps.version.outputs.should_publish == 'true'
        run: bun run build

      - name: Build MCP
        if: steps.version.outputs.should_publish == 'true'
        run: bun run build:mcp

      - name: Build luau-bundler
        if: steps.version.outputs.should_publish == 'true'
        run: bun run --cwd packages/luau-bundler build

      - name: Sync package versions
        if: steps.version.outputs.should_publish == 'true'
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          for pkg in packages/mcp/package.json packages/luau-bundler/package.json; do
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('${pkg}', 'utf8'));
              p.version = '${version}';
              fs.writeFileSync('${pkg}', JSON.stringify(p, null, 2) + '\n');
            "
          done

      - name: Publish MCP to npm
        if: steps.version.outputs.should_publish == 'true'
        working-directory: packages/mcp
        run: npm publish --access public

      - name: Publish luau-bundler to npm
        if: steps.version.outputs.should_publish == 'true'
        working-directory: packages/luau-bundler
        run: npm publish --access public

  docker:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          version=$(node -p "require('./package.json').version")
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/rbxdev-web:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/rbxdev-web:${{ steps.meta.outputs.version }}
