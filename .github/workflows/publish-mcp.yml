name: Publish MCP

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-mcp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  determine-publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_publish: ${{ steps.version.outputs.should_publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Determine MCP publish need
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          should_publish="false"
          version_changed="false"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version_changed="true"
          else
            if git cat-file -e "${{ github.event.before }}:package.json" 2>/dev/null; then
              old_version="$(git show "${{ github.event.before }}:package.json" | node -e "let s=''; process.stdin.on('data', d => s += d); process.stdin.on('end', () => process.stdout.write(JSON.parse(s).version));")"
            else
              old_version=""
            fi

            if [[ "${version}" != "${old_version}" ]]; then
              version_changed="true"
            fi
          fi

          if [[ "${version_changed}" == "true" ]]; then
            if npm view "@oneshot101/rbxdev-mcp@${version}" version >/dev/null 2>&1; then
              should_publish="false"
              echo "Version ${version} already exists on npm; skipping publish."
            else
              should_publish="true"
            fi
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "should_publish=${should_publish}" >> "$GITHUB_OUTPUT"
          echo "Detected version: ${version}"
          echo "Should publish: ${should_publish}"

  publish:
    runs-on: ubuntu-latest
    needs: determine-publish
    if: needs.determine-publish.outputs.should_publish == 'true'
    environment: npm-publish

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Build MCP bundle
        run: bun build src/mcp.ts --outdir dist --target node

      - name: Copy MCP bundle into package
        run: cp dist/mcp.js packages/rbxdev-mcp/mcp.js

      - name: Sync MCP package version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.determine-publish.outputs.version }}"
          node -e "const fs=require('fs'); const path='packages/rbxdev-mcp/package.json'; const pkg=JSON.parse(fs.readFileSync(path,'utf8')); pkg.version='${version}'; fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');"

      - name: Publish to npm
        working-directory: packages/rbxdev-mcp
        run: npm publish --provenance --access public

