name: Publish MCP

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_publish:
        description: Publish current package versions even if root version did not change
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version change
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          should_publish="false"
          old_version="none"
          if git show HEAD~1:package.json >/dev/null 2>&1; then
            old_version="$(node -e "console.log(JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version)" < <(git show HEAD~1:package.json))" || old_version="none"
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_publish }}" == "true" ]]; then
            should_publish="true"
          elif [[ "${version}" != "${old_version}" ]]; then
            should_publish="true"
          fi

          echo "should_publish=${should_publish}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.version.outputs.should_publish == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use latest npm
        if: steps.version.outputs.should_publish == 'true'
        run: npm install -g npm@latest

      - name: Check npm package versions
        if: steps.version.outputs.should_publish == 'true'
        id: npm_status
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"

          check_package() {
            local package_name="$1"
            local output_name="$2"

            if npm view "${package_name}@${version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              echo "${package_name}@${version} already exists; skipping publish."
              echo "${output_name}=false" >> "$GITHUB_OUTPUT"
            else
              echo "${package_name}@${version} is not published; publishing."
              echo "${output_name}=true" >> "$GITHUB_OUTPUT"
            fi
          }

          check_package "@oneshot101/rbxdev-mcp" "publish_mcp"
          check_package "@oneshot101/luau-bundler" "publish_luau_bundler"

      - name: Setup Bun
        if: steps.npm_status.outputs.publish_mcp == 'true' || steps.npm_status.outputs.publish_luau_bundler == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: steps.npm_status.outputs.publish_mcp == 'true' || steps.npm_status.outputs.publish_luau_bundler == 'true'
        run: bun install --frozen-lockfile

      - name: Build server (for exports)
        if: steps.npm_status.outputs.publish_mcp == 'true'
        run: bun run build

      - name: Build MCP
        if: steps.npm_status.outputs.publish_mcp == 'true'
        run: bun run build:mcp

      - name: Build luau-bundler
        if: steps.npm_status.outputs.publish_luau_bundler == 'true'
        run: bun run --cwd packages/luau-bundler build

      - name: Sync package versions
        if: steps.npm_status.outputs.publish_mcp == 'true' || steps.npm_status.outputs.publish_luau_bundler == 'true'
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          for pkg in packages/mcp/package.json packages/luau-bundler/package.json; do
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('${pkg}', 'utf8'));
              p.version = '${version}';
              fs.writeFileSync('${pkg}', JSON.stringify(p, null, 2) + '\n');
            "
          done

      - name: Publish MCP to npm
        if: steps.npm_status.outputs.publish_mcp == 'true'
        working-directory: packages/mcp
        run: npm publish --access public

      - name: Publish luau-bundler to npm
        if: steps.npm_status.outputs.publish_luau_bundler == 'true'
        working-directory: packages/luau-bundler
        run: npm publish --access public
