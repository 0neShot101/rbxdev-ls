name: Release Assets

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  determine-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version change
        id: version
        shell: bash
        run: |
          set -euo pipefail

          new_version="$(node -p "require('./package.json').version")"
          should_release="false"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            should_release="true"
          else
            if git cat-file -e "${{ github.event.before }}:package.json" 2>/dev/null; then
              old_version="$(git show "${{ github.event.before }}:package.json" | node -e "let s=''; process.stdin.on('data', d => s += d); process.stdin.on('end', () => process.stdout.write(JSON.parse(s).version));")"
            else
              old_version=""
            fi

            if [[ "${new_version}" != "${old_version}" ]]; then
              should_release="true"
            fi
          fi

          echo "version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "should_release=${should_release}" >> "$GITHUB_OUTPUT"
          echo "Detected version: ${new_version}"
          echo "Should release: ${should_release}"

  build-and-publish:
    runs-on: ubuntu-latest
    needs: determine-release
    if: needs.determine-release.outputs.should_release == 'true'
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Foreman (Rojo)
        uses: Roblox/setup-foreman@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: .github

      - name: Verify Rojo
        run: rojo --version

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install VS Code extension dependencies
        working-directory: vscode
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Type check
        run: bun run type-check

      - name: Build language server + MCP bundle
        run: bun build src/index.ts src/mcp.ts --outdir dist --target node

      - name: Bundle VS Code extension
        working-directory: vscode
        run: bun run bundle

      - name: Copy server files into extension package
        working-directory: vscode
        run: bun run copy-server

      - name: Package VSIX
        working-directory: vscode
        run: bun run package

      - name: Build Studio plugin asset
        run: bun run build:studio

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.determine-release.outputs.version }}"
          test -f "vscode/rbxdev-ls-${version}.vsix"
          test -f "studio-plugin/dist/rbxdev-studio-bridge.rbxm"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.determine-release.outputs.version }}
          name: v${{ needs.determine-release.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            vscode/rbxdev-ls-${{ needs.determine-release.outputs.version }}.vsix
            studio-plugin/dist/rbxdev-studio-bridge.rbxm

